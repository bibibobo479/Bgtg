<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Чат с файлами</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; height: 100vh; overflow: hidden; }
        #chat { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100vh; display: flex; flex-direction: column; }
        #header { background: #075E54; color: white; padding: 15px; display: flex; justify-content: space-between; }
        
        /* Панель пользователей */
        #users-panel {
            background: white;
            border-bottom: 1px solid #ddd;
            max-height: 150px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .users-list {
            overflow-y: auto;
            padding: 5px;
            max-height: 100px;
        }
        .user-item {
            padding: 5px 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .user-item.current-user {
            background: #e8f5e8;
        }
        .user-status {
            font-size: 12px;
        }
        .user-name {
            flex: 1;
        }
        .typing-indicator {
            color: #075E54;
            font-size: 11px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; }
        .message { margin: 5px 0; padding: 8px 12px; border-radius: 7px; max-width: 80%; word-wrap: break-word; }
        .my { background: #DCF8C6; margin-left: auto; }
        .other { background: white; }
        .system { background: rgba(0,0,0,0.5); color: white; margin: 0 auto; text-align: center; }
        
        #input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        #text { flex: 1; padding: 10px; border: none; border-radius: 20px; outline: none; }
        #send-btn { width: 50px; height: 50px; border-radius: 50%; background: #075E54; color: white; border: none; cursor: pointer; }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }
        #file-btn { width: 40px; height: 40px; border-radius: 50%; background: #2196F3; color: white; border: none; cursor: pointer; }
        #file-btn:disabled { background: #ccc; cursor: not-allowed; }
        #file-input { display: none; }
        
        #connect-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #075E54; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #connect-screen.hidden { display: none; }
        #connect-screen input { padding: 10px; width: 80%; margin-bottom: 10px; border: none; border-radius: 5px; }
        #connect-screen button { padding: 10px 20px; background: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        #status { padding: 5px 10px; border-radius: 5px; }
        #file-progress { display: none; padding: 8px; background: #e3f2fd; border-radius: 5px; margin: 5px; text-align: center; }
        #file-queue { display: none; padding: 8px; background: #fff3cd; border-radius: 5px; margin: 5px; max-height: 100px; overflow-y: auto; }
        
        .media-preview { max-width: 200px; max-height: 200px; border-radius: 5px; margin-top: 5px; cursor: pointer; }
        .file-link { color: #2196F3; text-decoration: none; }
        .file-link:hover { text-decoration: underline; }
        
        #history-loading {
            background: #2196F3 !important;
            color: white !important;
            margin: 10px auto !important;
            padding: 5px 15px !important;
            border-radius: 20px !important;
            font-size: 12px !important;
        }
        
        .message small {
            font-size: 10px;
            color: #999;
            margin-left: 10px;
            float: right;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id='chat'>
        <div id='connect-screen'>
            <h1 style='color:white; margin-bottom:20px;'>Чат с файлами</h1>
            <input type='text' id='device-input' placeholder='Ваше имя' value='User'>
            <button onclick='connect()'>Войти</button>
        </div>
        
        <div id='header'>
            <span id='device-name'></span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div id='users-count' style="background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 20px;">0</div>
                <span id='status'>🔴 Отключено</span>
            </div>
        </div>

        <!-- Панель с пользователями -->
        <div id='users-panel'>
            <div style="padding: 10px; background: #075E54; color: white; display: flex; justify-content: space-between;">
                <span>📋 Пользователи онлайн</span>
                <span id='users-count-header'>0</span>
            </div>
            <div id='users-list' class='users-list'></div>
        </div>
        
        <div id='messages'></div>
        <div id='file-queue'></div>
        <div id='file-progress'></div>
        
        <div id='input-area'>
            <input type='text' id='text' placeholder='Сообщение...' disabled>
            <input type='file' id='file-input' multiple>
            <button id='file-btn' onclick='selectFile()' disabled>📎</button>
            <button id='send-btn' onclick='send()' disabled>➤</button>
        </div>
    </div>

    <script>
        let ws = null;
        let device = '';
        let connected = false;
        const WS_URL = 'ws://188.92.28.209:8080/ws/chat/';
        
        // Для списка пользователей
        let onlineUsers = [];
        
        // Для lazy loading истории
        let messageHistory = [];
        let historyOffset = 0;
        let historyLimit = 20;
        let isLoadingHistory = false;
        let hasMoreHistory = true;
        let messagesDiv = document.getElementById('messages');
        
        // Для индикатора печатания
        let typingTimeout;
        let typingUsers = new Map(); // пользователь -> таймер
        
        // Очередь файлов для отправки
        let fileQueue = [];
        let currentFileIndex = 0;
        let isUploading = false;

        function connect() {
            device = document.getElementById('device-input').value.trim();
            if (!device) device = 'User' + Math.floor(Math.random() * 1000);

            document.getElementById('device-name').innerText = device;
            document.getElementById('connect-screen').classList.add('hidden');
            
            ws = new WebSocket(WS_URL + encodeURIComponent(device));

            ws.onopen = function() {
                connected = true;
                document.getElementById('status').innerHTML = '🟢 Подключено';
                document.getElementById('text').disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('file-btn').disabled = false;
                addSystemMessage('✅ Подключился к чату');
                document.getElementById('text').focus();
                
                // Сбрасываем историю при новом подключении
                messageHistory = [];
                historyOffset = 0;
                hasMoreHistory = true;
            };

            ws.onmessage = function(event) {
                if (typeof event.data === 'string') {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('Получено:', data.type);
                        
                        if (data.type === 'message') {
                            addMessage(data);
                        } 
                        else if (data.type === 'users') {
                            updateUsersList(data.users);
                        }
                        else if (data.type === 'typing') {
                            handleTypingIndicator(data.sender, data.typing);
                        }
                        else if (data.type === 'history' && data.messages) {
                            document.getElementById('messages').innerHTML = '';
                            data.messages.forEach(m => addMessage(m));
                            scrollToBottom();
                        }
                        else if (data.type === 'upload_complete') {
                            const progress = document.getElementById('file-progress');
                            
                            // Помечаем текущий файл как загруженный
                            if (fileQueue[currentFileIndex]) {
                                fileQueue[currentFileIndex].status = 'done';
                                
                                progress.innerHTML = `✅ Файл ${currentFileIndex + 1}/${fileQueue.length} загружен: ${data.fileName}`;
                                
                                // Отправляем сообщение о файле в чат
                                const fileMsg = {
                                    type: 'message',
                                    text: `📎 ${data.fileName}`,
                                    fileId: data.fileId,
                                    fileName: data.fileName,
                                    fileType: data.fileType
                                };
                                ws.send(JSON.stringify(fileMsg));
                                
                                addMessage({
                                    sender: device,
                                    text: `📎 ${data.fileName}`,
                                    fileId: data.fileId,
                                    fileName: data.fileName,
                                    fileType: data.fileType,
                                    time: new Date().toLocaleTimeString()
                                });
                                
                                // Переходим к следующему файлу
                                setTimeout(() => {
                                    if (currentFileIndex + 1 < fileQueue.length) {
                                        progress.innerHTML = '⏳ Подготовка следующего файла...';
                                    } else {
                                        progress.style.display = 'none';
                                    }
                                    moveToNextFile();
                                }, 1000);
                            }
                        }
                    } catch (e) {
                        console.error('Ошибка парсинга:', e);
                    }
                } else {
                    console.log('Получен бинарный чанк, размер:', event.data.byteLength);
                }
            };

            ws.onclose = function() {
                connected = false;
                document.getElementById('status').innerHTML = '🔴 Отключено';
                document.getElementById('text').disabled = true;
                document.getElementById('send-btn').disabled = true;
                document.getElementById('file-btn').disabled = true;
                document.getElementById('connect-screen').classList.remove('hidden');
                
                // Очищаем список пользователей
                onlineUsers = [];
                updateUsersList([]);
                
                // Очищаем очередь файлов
                fileQueue = [];
                currentFileIndex = 0;
                isUploading = false;
                updateFileQueue();
            };

            ws.onerror = function(error) {
                console.error('WebSocket ошибка:', error);
                addSystemMessage('❌ Ошибка подключения');
            };
        }

        // Обновление списка пользователей
        function updateUsersList(users) {
            onlineUsers = users.filter(u => u.online);
            
            const usersListDiv = document.getElementById('users-list');
            const usersCountSpan = document.getElementById('users-count');
            const usersCountHeader = document.getElementById('users-count-header');
            
            if (!usersListDiv) return;
            
            // Обновляем счетчики
            if (usersCountSpan) {
                usersCountSpan.innerText = onlineUsers.length;
            }
            if (usersCountHeader) {
                usersCountHeader.innerText = onlineUsers.length;
            }
            
            // Очищаем и заполняем список
            usersListDiv.innerHTML = '';
            
            onlineUsers.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item' + (user.device === device ? ' current-user' : '');
                
                let statusDot = '🟢';
                let userName = user.device === device ? 'Я (' + user.device + ')' : user.device;
                
                let typingHtml = typingUsers.has(user.device) ? '<span class="typing-indicator">печатает...</span>' : '';
                
                userDiv.innerHTML = `
                    <span class="user-status">${statusDot}</span>
                    <span class="user-name">${userName}</span>
                    ${typingHtml}
                `;
                
                usersListDiv.appendChild(userDiv);
            });
        }

        // Обработка индикатора печатания
        function handleTypingIndicator(sender, isTyping) {
            if (sender === device) return; // Игнорируем свои сообщения
            
            if (isTyping) {
                // Добавляем пользователя в список печатающих
                if (!typingUsers.has(sender)) {
                    typingUsers.set(sender, setTimeout(() => {
                        // Автоматически убираем индикатор через 3 секунды
                        typingUsers.delete(sender);
                        updateUsersList(onlineUsers);
                    }, 3000));
                }
            } else {
                // Убираем пользователя из списка печатающих
                if (typingUsers.has(sender)) {
                    clearTimeout(typingUsers.get(sender));
                    typingUsers.delete(sender);
                }
            }
            
            // Обновляем список пользователей
            updateUsersList(onlineUsers);
        }

        // Функция для ленивой загрузки истории
        function loadMoreHistory() {
            if (!connected || isLoadingHistory || !hasMoreHistory) return;
            
            isLoadingHistory = true;
            historyOffset += historyLimit;
            
            // Показываем индикатор загрузки
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'history-loading';
            loadingDiv.className = 'message system';
            loadingDiv.innerText = '⏳ Загрузка истории...';
            messagesDiv.insertBefore(loadingDiv, messagesDiv.firstChild);
            
            const url = `/api/history/${encodeURIComponent(device)}?offset=${historyOffset}&limit=${historyLimit}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('history-loading')?.remove();
                    
                    let messages = data.messages || [];
                    
                    if (messages.length > 0) {
                        const oldScrollHeight = messagesDiv.scrollHeight;
                        const oldScrollTop = messagesDiv.scrollTop;
                        
                        messages.reverse().forEach(msg => {
                            messageHistory.unshift(msg);
                            addMessageToTop(msg);
                        });
                        
                        messagesDiv.scrollTop = messagesDiv.scrollHeight - oldScrollHeight + oldScrollTop;
                    } else {
                        hasMoreHistory = false;
                    }
                    
                    isLoadingHistory = false;
                })
                .catch(error => {
                    console.error('Ошибка загрузки истории:', error);
                    document.getElementById('history-loading')?.remove();
                    isLoadingHistory = false;
                });
        }

        // Добавление сообщения в конец
        function addMessage(msg, scroll = true) {
            const messagesDiv = document.getElementById('messages');
            const div = createMessageElement(msg);
            messagesDiv.appendChild(div);
            
            if (scroll) {
                div.scrollIntoView({behavior: 'smooth'});
            }
        }

        // Добавление сообщения в начало
        function addMessageToTop(msg) {
            const messagesDiv = document.getElementById('messages');
            const div = createMessageElement(msg);
            messagesDiv.insertBefore(div, messagesDiv.firstChild);
        }

        // Создание элемента сообщения
        function createMessageElement(msg) {
            const div = document.createElement('div');
            
            if (msg.sender === 'system') {
                div.className = 'message system';
                div.innerText = msg.text;
            } else {
                div.className = 'message ' + (msg.sender === device ? 'my' : 'other');
                
                let content = '<b>' + (msg.sender === device ? 'Я' : msg.sender) + ':</b> ';
                
                if (msg.fileId) {
                    if (msg.fileType === 'image') {
                        content += '<div><img src="/file/' + msg.fileId + '" class="media-preview" onclick="window.open(\'/file/' + msg.fileId + '\')"></div>';
                    } else if (msg.fileType === 'video') {
                        content += '<div><video src="/file/' + msg.fileId + '" controls style="max-width:200px; max-height:200px;"></video></div>';
                    } else if (msg.fileType === 'audio') {
                        content += '<div><audio src="/file/' + msg.fileId + '" controls></audio></div>';
                    } else {
                        content += '<div><a href="/file/' + msg.fileId + '" class="file-link" target="_blank">📎 ' + (msg.fileName || 'Файл') + '</a></div>';
                    }
                }
                
                if (msg.text && !msg.text.startsWith('📎')) {
                    content += msg.text;
                }
                
                if (msg.time) {
                    content += ' <small>' + msg.time + '</small>';
                }
                
                div.innerHTML = content;
            }
            
            return div;
        }

        // Прокрутка вниз
        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Обработчик скролла
        messagesDiv.addEventListener('scroll', function() {
            if (messagesDiv.scrollTop < 100 && !isLoadingHistory && hasMoreHistory && connected) {
                loadMoreHistory();
            }
        });

        function send() {
            if (!connected) return;
            const text = document.getElementById('text').value.trim();
            if (!text) return;
            
            ws.send(JSON.stringify({
                type: 'message',
                text: text
            }));
            
            document.getElementById('text').value = '';
            
            // Сразу отправляем "закончил печатать"
            clearTimeout(typingTimeout);
            if (connected) {
                ws.send(JSON.stringify({
                    type: 'typing',
                    typing: false
                }));
            }
        }

        function selectFile() {
            document.getElementById('file-input').click();
        }

        // Обработка выбора файлов
        document.getElementById('file-input').onchange = function() {
            if (!this.files || this.files.length === 0 || !connected) return;
            
            for (let i = 0; i < this.files.length; i++) {
                const file = this.files[i];
                
                if (file.size > 100 * 1024 * 1024) {
                    alert(`Файл "${file.name}" слишком большой! Максимум 100 МБ`);
                    continue;
                }
                
                fileQueue.push({
                    file: file,
                    name: file.name,
                    size: file.size,
                    type: file.type.startsWith('image/') ? 'image' : 
                          file.type.startsWith('video/') ? 'video' : 
                          file.type.startsWith('audio/') ? 'audio' : 'file',
                    status: 'pending'
                });
            }
            
            updateFileQueue();
            
            if (!isUploading) {
                processNextFile();
            }
            
            this.value = '';
        };

        // Обновление отображения очереди
        function updateFileQueue() {
            const queueDiv = document.getElementById('file-queue');
            
            if (fileQueue.length === 0) {
                queueDiv.style.display = 'none';
                return;
            }
            
            queueDiv.style.display = 'block';
            let html = '<strong>📋 Очередь файлов:</strong><br>';
            
            fileQueue.forEach((item, index) => {
                let status = '';
                if (index === currentFileIndex && isUploading) {
                    status = ' ⏳ Загружается...';
                } else if (item.status === 'done') {
                    status = ' ✅';
                } else if (item.status === 'error') {
                    status = ' ❌';
                } else if (index < currentFileIndex) {
                    status = ' ⏳ В очереди';
                }
                
                html += `📁 ${item.name} (${formatFileSize(item.size)})${status}<br>`;
            });
            
            queueDiv.innerHTML = html;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }

        function processNextFile() {
            if (currentFileIndex >= fileQueue.length) {
                isUploading = false;
                fileQueue = [];
                currentFileIndex = 0;
                updateFileQueue();
                return;
            }
            
            isUploading = true;
            const queueItem = fileQueue[currentFileIndex];
            queueItem.status = 'uploading';
            updateFileQueue();
            
            uploadFile(queueItem);
        }

        function uploadFile(queueItem) {
            const file = queueItem.file;
            
            ws.send(JSON.stringify({
                type: 'file_metadata',
                fileName: file.name,
                fileType: queueItem.type,
                fileSize: file.size,
                fileIndex: currentFileIndex,
                totalFiles: fileQueue.length
            }));
            
            const chunkSize = 64 * 1024;
            let offset = 0;
            let chunkIndex = 0;
            const totalChunks = Math.ceil(file.size / chunkSize);
            
            const progress = document.getElementById('file-progress');
            progress.style.display = 'block';
            progress.innerHTML = `📤 [${currentFileIndex + 1}/${fileQueue.length}] 0% (${file.name}) [0/${totalChunks}]`;
            
            function sendNextChunk() {
                const chunk = file.slice(offset, offset + chunkSize);
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        ws.send(e.target.result);
                        
                        offset += chunkSize;
                        chunkIndex++;
                        let percent = Math.min(100, Math.round((offset / file.size) * 100));
                        
                        progress.innerHTML = `📤 [${currentFileIndex + 1}/${fileQueue.length}] ${percent}% (${file.name}) [${chunkIndex}/${totalChunks}]`;
                        
                        if (offset < file.size) {
                            setTimeout(sendNextChunk, 30);
                        } else {
                            progress.innerHTML = `✅ [${currentFileIndex + 1}/${fileQueue.length}] 100% (${file.name}) - ожидание...`;
                        }
                    } catch (err) {
                        console.error('Ошибка отправки чанка:', err);
                        queueItem.status = 'error';
                        progress.innerHTML = `❌ Ошибка отправки ${file.name}`;
                        setTimeout(() => {
                            progress.style.display = 'none';
                            moveToNextFile();
                        }, 3000);
                    }
                };
                
                reader.onerror = function() {
                    queueItem.status = 'error';
                    progress.innerHTML = `❌ Ошибка чтения ${file.name}`;
                    setTimeout(() => {
                        progress.style.display = 'none';
                        moveToNextFile();
                    }, 3000);
                };
                
                reader.readAsArrayBuffer(chunk);
            }
            
            sendNextChunk();
        }

        function moveToNextFile() {
            fileQueue[currentFileIndex].status = 'done';
            currentFileIndex++;
            updateFileQueue();
            processNextFile();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerText = text;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({behavior: 'smooth'});
        }

        // Индикатор печатания при вводе текста
        document.getElementById('text').addEventListener('input', function() {
            if (!connected) return;
            
            // Отправляем статус "печатает"
            ws.send(JSON.stringify({
                type: 'typing',
                typing: true
            }));
            
            // Сбрасываем предыдущий таймер
            clearTimeout(typingTimeout);
            
            // Через 2 секунды отправляем "закончил печатать"
            typingTimeout = setTimeout(() => {
                if (connected) {
                    ws.send(JSON.stringify({
                        type: 'typing',
                        typing: false
                    }));
                }
            }, 2000);
        });

        // Отправка по Enter
        document.getElementById('text').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && connected) {
                send();
            }
        });
    </script>
</body>
</html>
